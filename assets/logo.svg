  <circle cx="94" cy="35" r="9" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="2.5"/>
  <!-- Token usage bars -->
  <rect x="28" y="76" width="14" height="24" rx="4" fill="url(#bar1)"/>
  <rect x="48" y="64" width="14" height="36" rx="4" fill="url(#bar2)"/>
  <rect x="68" y="54" width="14" height="46" rx="4" fill="url(#bar3)"/>
  <rect x="88" y="68" width="14" height="32" rx="4" fill="url(#bar1)"/>
  <!-- Trend line -->
  <path d="M35 70 L55 58 L75 48 L95 60" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
